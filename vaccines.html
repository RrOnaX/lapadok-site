<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь прививок — ЛапаДок</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><span class="logo-mark">🐾</span>ЛАПАДОК</a>
    <button class="burger" aria-label="Меню">☰</button>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="services.html">Услуги</a>
      <a href="doctors.html">Врачи</a>
      <a href="vaccines.html" class="active">Календарь прививок</a>
      <a href="pet-kit.html">Аптечка</a>
      <a href="contacts.html">Контакты</a>
    </nav>
    <a href="tel:+79006062424" class="header-phone" data-event="contact_click" data-contact-type="phone">📞 +7 (900) 606-24-24</a>
  </div>
</header>

<section class="page-header"><div class="container"><h1>Календарь прививок</h1><p>Рассчитайте график для вашего питомца</p></div></section>

<section><div class="container" style="max-width:800px">
  <div class="vaccine-form">
    <div class="row">
      <div class="form-group">
        <label>Вид животного</label>
        <select id="petType">
          <option value="cat">Кошка</option>
          <option value="dog">Собака</option>
          <option value="rabbit">Кролик</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Возраст (недель)</label>
        <input type="number" id="ageWeeks" value="8" min="0" max="300">
      </div>
    </div>
    <button id="calcBtn" class="btn" style="width:100%">Рассчитать график</button>
  </div>
  <div id="result" class="vaccine-result" style="display:none"></div>
</div></section>

<footer class="footer"><div class="container footer-inner">
  <div><h3>ЛАПАДОК</h3></div>
  <div><p><a href="tel:+79006062424">+7 (900) 606-24-24</a></p></div>
</div></footer>
<script src="js/analytics.js"></script>
<script src="js/vaccines.js"></script>
<script>
document.querySelector('.burger').addEventListener('click', () => document.querySelector('.nav').classList.toggle('active'));
document.getElementById('calcBtn').addEventListener('click', () => {
  const petType = document.getElementById('petType').value;
  const ageWeeks = parseInt(document.getElementById('ageWeeks').value) || 0;
  window.trackEvent('vaccine_calc', { pet_type: petType, age_weeks: ageWeeks });
  const result = window.calcVaccines(petType, ageWeeks);
  const container = document.getElementById('result');
  container.style.display = 'block';
  if (result.other) {
    container.innerHTML = `<h3>Индивидуальный график</h3><p>${result.message}</p><a href="contacts.html" class="btn" style="margin-top:20px" data-event="cta_click" data-button-name="vaccine_other" data-page-section="vaccines">Записаться на консультацию</a>`;
  } else {
    let html = '<h3>График прививок</h3><div class="vaccine-schedule">';
    result.forEach((item, i) => {
      html += `<div class="vaccine-step"><div class="step-num">${i+1}</div><div class="step-info"><strong>${item.name}</strong><small>${item.week} недель — ${item.date}</small></div></div>`;
    });
    html += '</div><a href="contacts.html" class="btn" style="width:100%" data-event="cta_click" data-button-name="vaccine_schedule_book" data-page-section="vaccines">Записаться на прививку</a>';
    container.innerHTML = html;
  }
});
</script>
</body>
</html>
